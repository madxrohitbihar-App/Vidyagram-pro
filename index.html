<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIDYAGREAM MADXROHIBIHAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            overflow: hidden;
        }

        /* App Container */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            position: relative;
            background-color: #f8fafc;
        }

        /* Top Custom Header - White Theme */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            flex-shrink: 0;
            transition: transform 0.3s ease, opacity 0.3s ease, height 0.3s ease;
        }
        .top-header.hidden-header {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
            height: 0;
            border: none;
            overflow: hidden;
        }
        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cw-brand-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 4px 14px 4px 6px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .cw-header-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: contain;
        }
        .brand-text-group {
            display: flex;
            flex-direction: column;
        }
        .cw-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .cw-title {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
        }
        .cw-verified {
            width: 14px;
            height: 14px;
            background: #0ea5e9;
            color: #ffffff;
            border-radius: 50%;
            font-size: 9px;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .developer-subtext {
            font-size: 10px;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* Iframe Container */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: calc(100% + 70px);
            margin-top: -70px;
            border: none;
            display: block;
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Custom Header -->
        <header class="top-header" id="mainHeader">
            <div class="header-container">
                <div class="header-left">
                    <div class="cw-brand-badge">
                        <img class="cw-header-logo" src="https://i.postimg.cc/SNG4r8cJ/image-search-1793448195795.png" alt="Logo">
                        <div class="brand-text-group">
                            <div class="cw-title-row">
                                <span class="cw-title">VIDYAGREAM</span>
                                <span class="cw-verified">✓</span>
                            </div>
                            <span class="developer-subtext">Developer By MedxrohitBihar</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Website Area -->
        <div class="iframe-container">
            <iframe id="appFrame" src="https://vidya.learnvortex.cc.cd/" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Auto hide/show header script
        window.addEventListener('load', function() {
            const iframe = document.getElementById('appFrame');
            const header = document.getElementById('mainHeader');

            try {
                iframe.addEventListener('load', function() {
                    const iframeWin = iframe.contentWindow;
                    
                    setInterval(function() {
                        try {
                            const currentUrl = iframeWin.location.href.toLowerCase();
                            if (currentUrl.includes('play') || currentUrl.includes('video') || currentUrl.includes('watch') || currentUrl.includes('class') || currentUrl.includes('player')) {
                                header.classList.add('hidden-header');
                            } else {
                                header.classList.remove('hidden-header');
                            }
                        } catch (e) {}
                    }, 500);
                });
            } catch (e) {}
        });
    </script>

</body>
</html>
